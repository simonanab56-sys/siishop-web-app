workflows:
  ios-release:
    name: SiiShop iOS Release
    max_build_duration: 120

    environment:
      node: 20
      xcode: latest
      cocoapods: default

    scripts:

      # Go into frontend project
      - cd frontend

      # Install dependencies
      - npm ci

      # Build production frontend
      - npm run build

      # Sync Capacitor iOS project
      - npx cap sync ios

      # Go to iOS project
      - cd ios/App

      # Install CocoaPods
      - pod install

      # Build IPA
      - xcode-project build-ipa \
          --workspace App.xcworkspace \
          --scheme App \
          --archive-flags="-destination generic/platform=iOS"

    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa