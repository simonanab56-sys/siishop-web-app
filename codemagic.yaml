workflows:
  ios-release:
    name: SiiShop iOS Production Release
    max_build_duration: 120

    environment:
      node: 22
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.siishop.app

    integrations:
      app_store_connect: App Store Connect

    scripts:
      - name: Install frontend dependencies
        script: |
          cd frontend
          npm install

      - name: Build production app
        script: |
          cd frontend
          npm run build

      - name: Sync Capacitor iOS
        script: |
          cd frontend
          npx cap sync ios

      - name: Verify iOS project
        script: |
          cd frontend/ios/App
          ls

      - name: Build signed IPA
        script: |
          cd frontend/ios/App

          xcode-project use-profiles

          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App

    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration