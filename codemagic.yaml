workflows:
  ios-release:
    name: SiiShop iOS Release
    max_build_duration: 120

    environment:
      node: 22
      xcode: latest

    scripts:
      - name: Install frontend dependencies
        script: |
          cd frontend
          npm install

      - name: Build production app
        script: |
          cd frontend
          npm run build

      - name: Sync Capacitor iOS
        script: |
          cd frontend
          npx cap sync ios

      - name: Verify iOS files
        script: |
          cd frontend/ios/App
          ls

      - name: Build IPA
        script: |
          cd frontend/ios/App

          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App \
            --archive-flags="-destination generic/platform=iOS"

    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa