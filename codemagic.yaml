workflows:
  ios-release:
    name: SiiShop iOS Release
    max_build_duration: 120

    environment:
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - cd frontend

      # FIXED
      - npm install

      - npm run build

      - npx cap sync ios

      - cd ios/App

      - pod install

      - xcode-project build-ipa \
          --workspace App.xcworkspace \
          --scheme App

    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa