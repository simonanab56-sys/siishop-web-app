workflows:
  ios-test:
    name: SiiShop iOS Test Build
    max_build_duration: 120

    environment:
      node: 22
      xcode: latest

    scripts:
      - name: Install frontend dependencies
        script: |
          cd frontend
          npm install

      - name: Build production app
        script: |
          cd frontend
          npm run build

      - name: Sync Capacitor iOS
        script: |
          cd frontend
          npx cap sync ios

      - name: Verify iOS files
        script: |
          cd frontend/ios/App
          ls

      - name: Build unsigned app
        script: |
          cd frontend/ios/App

          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            build

    artifacts:
      - frontend/ios/App/build/**/*.app