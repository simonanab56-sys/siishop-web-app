<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Primary SEO -->
  <title>SiiShop - Multi-Vendor Marketplace</title>
  <meta name="description" content="SiiShop - Your Trusted Multi-Vendor Marketplace. Discover amazing products from verified vendors. Shop electronics, fashion, home & garden, beauty, sports and more." />
  <meta name="keywords" content="online shopping, multi-vendor marketplace, electronics, fashion, home decor, beauty products, sports equipment, buy online, e-commerce" />
  <meta name="author" content="SiiShop" />
  <meta name="theme-color" content="#f97316" />
  <meta name="robots" content="index, follow" />
  <!-- Canonical URL -->
  <link rel="canonical" href="https://siishops.com/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://siishops.com/" />
  <meta property="og:title" content="SiiShop - Your Trusted Multi-Vendor Marketplace" />
  <meta property="og:description" content="Discover amazing products from verified vendors. Shop electronics, fashion, home & garden, beauty, sports and more. Secure payments, fast delivery." />
  <meta property="og:image" content="https://siishops.com/og-image.jpg" />
  <meta property="og:site_name" content="SiiShop" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://siishops.com/" />
  <meta name="twitter:title" content="SiiShop - Your Trusted Multi-Vendor Marketplace" />
  <meta name="twitter:description" content="Discover amazing products from verified vendors. Shop electronics, fashion, home & garden, beauty, sports and more." />
  <meta name="twitter:image" content="https://siishops.com/og-image.jpg" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "SiiShop",
    "url": "https://siishops.com",
    "description": "Multi-vendor marketplace connecting buyers with verified sellers",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://siishops.com/?q={search_term_string}",
      "query-input": "required name=search_term_string"
    },
    "publisher": {
      "@type": "Organization",
      "name": "SiiShop",
      "logo": {
        "@type": "ImageObject",
        "url": "https://siishops.com/logo.png"
      }
    }
  }
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "SiiShop",
    "url": "https://siishops.com",
    "logo": "https://siishops.com/logo.png",
    "sameAs": [
      "https://facebook.com/siishops",
      "https://twitter.com/siishops",
      "https://instagram.com/siishops"
    ],
    "contactPoint": {
      "@type": "ContactPoint",
      "telephone": "+233-000-000-000",
      "contactType": "customer service"
    }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
